<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量添加水印</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- 纸糊的前端喵 凑合看一下吧 -->
    <div class="box">
        <img id="image" src="soyo.jpg">

        <div id="message" style="font-size: 30px; color: black; font-weight: bold; text-align: center;">批量添加图片水印</div>

        <input type="file" id="fileInput" multiple style="display:none;" accept=".jpg, .jpeg, .png, .gif">
        <button id="uploadButton">选择多张图片</button>

        <div class="input-group">
            <label for="watermarkText">水印内容</label>
            <input type="text" id="watermarkText" placeholder="WaterMark">
        </div>

        <div class="input-group-inline">
            <div class="input-wrapper">
                <label for="watermarkX">水印坐标X</label>
                <input type="number" id="watermarkX" placeholder="0">
            </div>

            <div class="input-wrapper">
                <label for="watermarkY">水印坐标Y</label>
                <input type="number" id="watermarkY" placeholder="0">
            </div>
        </div>

        <button id="processButton">添加水印</button>
        <button id="downloadButton">下载图片</button>
    </div>
</body>
<footer>
    <script src="script.js"></script>
</footer>
</html>
